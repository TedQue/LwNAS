[package]
name = "lwnas"
version = "0.6.7"
edition = "2024"
authors = ["Ted.Que <Que's Software>"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["full"] }
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["file-stream"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
tera = { version = "2.0.0", features = ["glob_fs"] }
log = { version = "0.4.33", features = ["serde"] }
async_logger = { path = "../async_logger" }
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
chrono = "0.4.45"
constcat = "0.6.1"
anyhow = "1.0.104"
uuid = { version = "1.24.0", features = ["v4"] }
image = { version = "0.25.10", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
